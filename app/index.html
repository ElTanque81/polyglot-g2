<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Polyglot</title>
    <style>
      :root { --bg: #232323; --card: #2d2d2d; --line: #3a3a3a; --text: #e5e5e5; --muted: #a3a3a3; --accent: #4ade80; --danger: #f87171; }
      :root { color-scheme: dark; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
      #app { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; box-sizing: border-box; }
      header { position: relative; margin-bottom: 16px; }
      h1 { margin: 0; font-size: 24px; color: var(--accent); letter-spacing: .5px; }
      h2 { font-size: 15px; margin: 0 0 4px; }
      .sub, .hint, .who, .privacy { color: var(--muted); margin: 4px 0 10px; font-size: 13px; }
      .privacy { margin-top: 24px; font-size: 12px; }
      .lang { position: absolute; top: 0; right: 0; display: flex; gap: 4px; }
      .lang button { width: auto; padding: 4px 10px; margin: 0; font-size: 12px; }
      .lang button.on { border-color: var(--accent); color: var(--accent); }
      section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 12px 0; }
      label { display: block; margin: 8px 0; font-size: 13px; color: var(--muted); }
      input, select { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 10px 12px; border-radius: 10px;
        border: 1px solid var(--line); background: #1b1b1b; color: var(--text); font-size: 16px; }
      .search { margin: 0 0 4px; }
      button { display: block; width: 100%; padding: 12px; margin: 10px 0 0; border-radius: 10px; border: 1px solid var(--line);
        background: transparent; color: var(--text); font-size: 15px; }
      button.primary { background: var(--accent); color: #0b0b0b; border: 0; font-weight: 600; }
      button.danger { color: var(--danger); border-color: #5a2a2a; margin-top: 24px; }
      button:disabled { opacity: .5; }
      .chat { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 15px; padding: 6px 0; border-top: 1px solid var(--line); margin: 0; }
      .chat input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--accent); }
      .chat span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chat em { font-style: normal; font-size: 12px; background: var(--accent); color: #0b0b0b; border-radius: 10px; padding: 1px 7px; }
      .or { text-align: center; color: var(--muted); margin: 12px 0 0; font-size: 12px; }
      .err { color: var(--danger); font-size: 13px; min-height: 1em; }
      .ok { color: var(--accent); font-size: 13px; min-height: 1em; }
    </style>
  </head>
  <body>
    <div id="app">Polyglot…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
